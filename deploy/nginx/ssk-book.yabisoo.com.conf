# ssk-book.yabisoo.com — TLS on host nginx → Docker edge :18181
# Do not mark default_server. Never edit yabisoo/likonda/ulizo/monama vhosts.
# Default cert path is self-signed; deploy-prod.sh switches to Let's Encrypt when available.

server {
  listen 80;
  listen [::]:80;
  server_name ssk-book.yabisoo.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ssk-book.yabisoo.com;
  client_max_body_size 52m;

  ssl_certificate /etc/ssl/ssk-book/ssk-book.yabisoo.com.crt;
  ssl_certificate_key /etc/ssl/ssk-book/ssk-book.yabisoo.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://ssk-book.yabisoo.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  access_log /var/log/nginx/ssk-book.yabisoo.com.access.log;
  error_log /var/log/nginx/ssk-book.yabisoo.com.error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    proxy_pass http://127.0.0.1:18181;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
