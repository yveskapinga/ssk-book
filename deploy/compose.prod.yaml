# Production stack — project name: ssk-book
# Bindings are loopback-only. Host nginx terminates TLS for ssk-book.yabisoo.com.
name: ssk-book

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ssk-book-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssk_book}
      POSTGRES_USER: ${POSTGRES_USER:-ssk_book}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "127.0.0.1:${SSK_PG_PORT:-55440}:5432"
    volumes:
      - ssk_book_pgdata:/var/lib/postgresql/data
      - ../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ssk_net

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.prod
    container_name: ssk-book-api
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ssk_book}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ssk_book}?serverVersion=16&charset=utf8
      BOOK_STORAGE_PATH: /app/var/books
      AIGW_BASE_URL: ${AIGW_BASE_URL:-http://ai-gateway-api:18190}
    volumes:
      - ../storage/books:/app/var/books
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ssk_net

  edge:
    image: nginx:1.27-alpine
    container_name: ssk-book-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SSK_EDGE_PORT:-18181}:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - ssk_net

volumes:
  ssk_book_pgdata:

networks:
  ssk_net:
    name: ssk_net
    external: true
