parameters: {}

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: ../src/
    exclude:
      - ../src/Kernel.php

  App\Ai\GeminiClient:
    arguments:
      $embeddingDimension: '%env(int:GEMINI_EMBEDDING_DIMENSION)%'

  AiGateway\Sdk\HttpTransport:
    arguments:
      $baseUrl: '%env(AIGW_BASE_URL)%'
      $timeoutMs: 150000

  AiGateway\Sdk\GatewayClient:
    arguments:
      $transport: '@AiGateway\Sdk\HttpTransport'
      $apiKey: '%env(AIGW_API_KEY)%'
